name: check

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax
        run: python3 -m compileall -q scripts tests

      - name: Offline tests
        run: python3 tests/test_oc_recall.py

      - name: Ranking benchmark
        run: python3 tests/test_quality.py

      - name: Help works on a clean environment
        run: env -i HOME="$(mktemp -d)" PATH=/usr/bin:/bin python3 scripts/oc_recall.py --help

      - name: No personal paths or credentials in the tree
        run: |
          if grep -rnE '/Users/[a-z]|/home/[a-z]+/|ghp_|github_pat_|AKIA[0-9A-Z]{16}' \
               --include='*.py' --include='*.md' --include='*.sh' --include='*.json' .; then
            echo "personal path or credential found"; exit 1
          fi
